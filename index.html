<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كشوفي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f5f3">
<meta name="color-scheme" content="light only">
<title>كشوفي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* كشوفي — الهوية الثالثة: «الزمرّد» (أسلوب pastel-consumer من Taste Skill، البذرة 595784828، مع وجه مأخوذ من عالم المادة).
   الفكرة: لكل بند في الكشف لونه الهادئ الخاص (السلوك زمرّدي، المشاركة أزرق، الواجبات كهرماني، المشروع وردي، القصير فيروزي،
   والتسميع ذهبي كتذهيب المصحف)، يظهر باهتاً في الخلفية وداكناً في الحبر. ولكل مادة لونها في رأس الشاشة،
   مع نقش نجمة ثمانية خفيف، والعلامة «ربع الحزب» (۞) الذي يقسم المصحف. */
:root{
  --ground:#f2f5f3; --surface:#ffffff; --raised:#f7f9f8; --active:#e8eeeb;
  --border:#e4e9e6; --rule:#eef2f0; --control:#d3dbd7;
  --text:#14201b; --muted:#5a6762;
  --brand:#0f6b4f; --brand-ink:#0a4a37; --brand-pale:#e1f2ea;
  --qur:#0e5a6a; --qur-pale:#ddeff2;
  --primary:var(--brand); --on-primary:#ffffff;
  --hue:var(--brand); --hue-ink:var(--brand-ink); --hue-pale:var(--brand-pale); --track:#e3e9e6;
  --gold:#8a6d12; --gold-pale:#f6efd6; --gold-ink:#5c480a;
  --positive:#247b50; --negative:#c4242a;
  --pill-positive-bg:#dcfae5; --pill-positive-ink:#04250e;
  --pill-negative-bg:#ffedea; --pill-negative-ink:#831c1e;
  --pill-warning-bg:#fff6e0; --pill-warning-ink:#8a4b05; --pill-warning-line:#f6dd9c;
  --radius-card:20px; --radius-inner:14px; --radius-control:12px; --radius-chip:999px;
  --gap:12px;
  --lift:0 1px 2px rgba(16,40,30,.04),0 6px 20px rgba(16,40,30,.06);
  --font:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --fig:var(--font);
  --shade:rgba(10,26,20,.45);
  /* أسماء الإصدار السابق ما زالت تُستعمل داخل الشيفرة */
  --paper:var(--ground); --sheet:var(--surface); --raise:var(--raised); --ink:var(--text); --ink-dim:var(--muted);
  --rule-strong:var(--control); --green:var(--brand); --green-soft:var(--brand-pale); --on-green:#fff; --red:var(--negative);
  --p1:var(--brand); --p2:#b07a1a; --display:var(--font); --body:var(--font);
  color-scheme:light;
}
/* ألوان البنود: باهت للخلفية، وداكن للحبر، وصريح للزر */
.c0{--c-pale:#e1f2ea;--c-ink:#0b4d36;--c:#13865d}
.c1{--c-pale:#dfeeff;--c-ink:#0a3a80;--c:#1d5fd6}
.c2{--c-pale:#fdf0d3;--c-ink:#7a4706;--c:#c27c0e}
.c3{--c-pale:#fde4ec;--c-ink:#82203f;--c:#c23a64}
.c4{--c-pale:#ddf2f4;--c-ink:#0b5560;--c:#16808f}
.ct{--c-pale:var(--gold-pale);--c-ink:var(--gold-ink);--c:var(--gold)}
/* ألوان الطلاب: لكل طالب لون ثابت لدائرة حرفه الأول */
.a0{--a-pale:#e1f2ea;--a-ink:#0b4d36}.a1{--a-pale:#dfeeff;--a-ink:#0a3a80}.a2{--a-pale:#fdf0d3;--a-ink:#7a4706}
.a3{--a-pale:#fde4ec;--a-ink:#82203f}.a4{--a-pale:#ddf2f4;--a-ink:#0b5560}.a5{--a-pale:#f6efd6;--a-ink:#5c480a}
.a6{--a-pale:#eceafb;--a-ink:#3b3477}.a7{--a-pale:#ffe9dc;--a-ink:#7c3510}

*{box-sizing:border-box}
/* منع التكبير عند اللمس المزدوج على مساحة فارغة (آيفون) */
html,body,*{touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s ease,border-color .15s ease,transform .1s ease,box-shadow .15s ease}
button:active:not([disabled]){transform:scale(.96)}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.dim{color:var(--muted)}
.small{font-size:13px}
svg.ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* الإطار */
.app{position:relative;max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--ground)}
.scr{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:28px;display:flex;flex-direction:column;gap:var(--gap);-webkit-overflow-scrolling:touch}
.scr>*{min-width:0;flex:0 0 auto}

/* العلامة: ربع الحزب ۞ أبيض على الزمرّد */
.mark{width:40px;height:40px;flex:0 0 auto;display:block}
.brandrow{display:flex;align-items:center;gap:12px}

/* الرأس */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.hd .t{display:flex;flex-direction:column;min-width:0}
.hd h1{font-size:23px;font-weight:600;color:var(--text)}
.hd .brandrow h1{font-size:26px;font-weight:700;color:var(--brand-ink)}
.iconbtn{min-width:44px;min-height:44px;border-radius:var(--radius-control);border:0;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:500;font-size:14px;flex:0 0 auto;border:1px solid var(--border)}
.saved{font-size:12.5px;color:var(--brand);font-weight:500;background:var(--brand-pale);border-radius:999px;padding:3px 10px}
.saved.bad{color:var(--pill-negative-ink);background:var(--pill-negative-bg);font-weight:600}
.clsbtn{border:0;background:var(--brand-pale);border-radius:999px;padding:0 12px;min-height:30px;font-size:13px;font-weight:500;color:var(--brand-ink);margin-top:4px;align-self:flex-start}

/* رأس شاشة الصف: لوح بلون المادة ونقش نجمة ثمانية خفيف */
.hero{position:relative;border-radius:24px;padding:14px 14px 12px;color:#fff;display:flex;flex-direction:column;gap:12px;background-color:var(--brand);overflow:hidden;isolation:isolate}
.hero.qur{background-color:var(--qur)}
.hero .hd h1{color:#fff;font-size:24px;font-weight:600}
.hero .iconbtn{background:rgba(255,255,255,.14);color:#fff;border:0}
.hero .clsbtn{background:rgba(255,255,255,.18);color:#fff}
.hero .subj{background:rgba(0,0,0,.16)}
.hero .subj button{color:rgba(255,255,255,.8)}
.hero .subj button[aria-pressed=true]{background:#fff;color:var(--brand-ink)}
.hero.qur .subj button[aria-pressed=true]{color:var(--qur)}

/* عام */
.card{background:var(--surface);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:var(--gap);box-shadow:var(--lift)}
.btn{min-height:46px;border-radius:var(--radius-control);border:1px solid var(--control);background:var(--surface);padding:8px 16px;font-weight:500;color:var(--text)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn.soft{background:var(--brand-pale);border-color:transparent;color:var(--brand-ink)}
.btn.dash{border:1.5px dashed var(--control);color:var(--brand-ink);background:transparent}
.btn.danger{color:var(--negative);border-color:#f0b9b4;background:var(--surface)}
.btn.armed{background:var(--negative);color:#fff;border-color:var(--negative)}
.btn.plain{background:transparent;border:0;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row>*{min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--active);border-radius:var(--radius-control);padding:3px}
.seg button{border:0;border-radius:10px;background:transparent;min-height:36px;font-size:13.5px;font-weight:500;color:var(--muted);padding:0 4px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--brand-ink);font-weight:600}
.seg.per button[aria-pressed=true][data-p="2"]{color:#7a4706}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--active);border-radius:14px;padding:3px}
.subj button{min-height:40px;border-radius:11px;border:0;background:transparent;font-weight:500;font-size:15px;color:var(--muted)}
.subj button[aria-pressed=true]{background:var(--surface);color:var(--brand-ink);font-weight:600}
.sec{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;padding-top:8px;color:var(--text)}
.sec i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sec .s{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--muted)}
.pill{font-size:12px;font-weight:500;border-radius:999px;padding:1px 9px;background:var(--active);color:#3a4641;white-space:nowrap;flex:none}
.pill.p1{background:var(--brand-pale);color:var(--brand-ink)} .pill.p2{background:#fdf0d3;color:#7a4706}
.ok{color:var(--positive)} .bad{color:var(--negative)}

/* المعلم والتنبيهات */
.who-t{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius-card);padding:12px 14px;box-shadow:var(--lift)}
.av{width:42px;height:42px;border-radius:50%;background:var(--a-pale,var(--brand-pale));color:var(--a-ink,var(--brand-ink));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;flex:0 0 auto}
.who-t .tx{flex:1;min-width:0;line-height:1.45}
.who-t button{min-height:38px;border-radius:999px;border:0;background:var(--brand-pale);font-weight:500;font-size:13.5px;padding:0 14px;color:var(--brand-ink)}
.bk{display:flex;align-items:center;gap:12px;border-radius:var(--radius-card);padding:14px 16px;background:var(--pill-warning-bg);color:var(--pill-warning-ink)}
.bk .tx{flex:1;font-size:14px;line-height:1.55}
.bk button{min-height:38px;border-radius:999px;border:0;background:var(--pill-warning-ink);color:#fff;font-weight:600;padding:0 14px;flex:0 0 auto}
.bk.ok{background:var(--brand-pale);color:var(--brand-ink)}
.bk.ok button{background:var(--brand);color:#fff}
.bk.red{background:var(--pill-negative-bg);color:var(--pill-negative-ink)} .bk.red button{background:var(--negative)}
.install{border-radius:var(--radius-card);padding:16px;background:var(--pill-warning-bg);color:var(--pill-warning-ink);display:flex;flex-direction:column;gap:8px;font-size:14px}
.install ol{margin:0;padding-inline-start:20px;line-height:1.9}

/* الصفوف في الصفحة الرئيسية */
.ccard{background:var(--surface);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:var(--gap);box-shadow:var(--lift);border:2px solid transparent}
.ccard.cur{border-color:var(--brand)}
.ccard .nm{font-size:21px;font-weight:700;line-height:1.25}
.ccard .iconbtn{border:0;background:var(--raised);color:var(--muted)}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtns button{min-height:64px;border-radius:var(--radius-inner);border:0;font-weight:600;font-size:15px;text-align:start;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.sbtns button small{font-weight:500;font-size:12.5px;opacity:.8}
.sbtns .isl{background:var(--brand-pale);color:var(--brand-ink)}
.sbtns .qur{background:var(--qur-pale);color:var(--qur)}

/* الدخول */
.login{display:flex;flex-direction:column;gap:var(--gap);padding-top:12px}
.login .brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 0 10px;text-align:center}
.login .brand .mark{width:68px;height:68px}
.login .brand h1{font-size:32px;font-weight:700;color:var(--brand-ink)}
.tlist{display:flex;flex-direction:column;gap:10px}
.tlist button{display:flex;align-items:center;gap:12px;min-height:68px;border-radius:var(--radius-card);border:0;background:var(--surface);padding:10px 14px;text-align:start;border:1px solid var(--border)}
.tlist .tx{flex:1;min-width:0;line-height:1.45}
.pinbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:20px}
.pinbox .av{width:72px;height:72px;font-size:28px}
.dots{display:flex;gap:16px;direction:ltr}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--brand);display:block}
.dots i.on{background:var(--brand)}
.dots.err i{border-color:var(--negative)}
.dots.err{animation:shake .35s ease}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr;justify-content:center}
.pinpad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--surface);font-size:27px;font-weight:500;border:1px solid var(--border)}
.pinpad button.ghost{background:transparent;box-shadow:none;font-size:15px;color:var(--brand-ink)}
.pinmsg{min-height:22px;font-size:14px;font-weight:600;color:var(--negative);text-align:center}
input.pin{direction:ltr;text-align:center;letter-spacing:10px;font-size:22px;font-weight:700;-webkit-text-security:disc}

/* الإعدادات */
.comp{background:var(--surface);border-radius:var(--radius-card);padding:14px 16px;display:flex;flex-direction:column;gap:var(--gap);box-shadow:var(--lift);border-top:4px solid var(--p1)}
.comp.p2{border-top-color:var(--p2)} .comp.pt{border-top-color:var(--gold)}
.cname{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--control);background:transparent;padding:4px 2px;font-size:16px;font-weight:600;min-height:42px;border-radius:0}
.cname:focus,.iname:focus{border-bottom-color:var(--brand);outline:none}
.del{min-width:42px;min-height:42px;border:0;border-radius:var(--radius-control);background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.del.armed{background:var(--negative);color:#fff}
.ilist{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.irow{display:flex;align-items:center;gap:6px}
.iname{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--control);background:transparent;padding:4px 2px;font-size:16px;min-height:40px;border-radius:0}
.irow .step span{min-width:40px;width:44px}
.irow .step button{min-width:36px}
.kdesc{font-size:12.5px;color:var(--muted);margin-top:-4px}
.step{display:inline-flex;align-items:center;border-radius:var(--radius-control);overflow:hidden;direction:ltr;flex:0 0 auto;background:var(--raised);border:1px solid var(--border)}
.step button{min-width:42px;min-height:40px;border:0;background:var(--brand-pale);font-size:20px;font-weight:500;color:var(--brand-ink)}
.step button[disabled]{color:var(--control);background:var(--raised);cursor:not-allowed}
.step span,.step input{min-width:50px;width:58px;text-align:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;border:0;background:transparent;min-height:40px;padding:0}
.sumbar{position:sticky;bottom:0;background:var(--surface);border-radius:var(--radius-card);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -4px 24px rgba(16,40,30,.12)}
.sumbar .sv{font-size:22px;font-weight:700}
.srow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--rule);padding:2px 0}
.srow .i{width:26px;text-align:center;color:var(--muted);font-size:13px;flex:0 0 auto}
.srow input{flex:1;min-width:0;border:0;background:transparent;min-height:44px;padding:0 4px}

/* شبكة الصف */
.ctx{display:flex;flex-direction:column;gap:var(--gap)}
.ctx .row p{font-size:14px}
.ctx .ttl{display:flex;align-items:center;gap:8px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;border-radius:999px;border:0;background:var(--surface);padding:0 14px;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.chip[aria-pressed=true]{background:var(--c,var(--brand));color:#fff;box-shadow:none}
.chip.warn{background:var(--pill-warning-bg);color:var(--pill-warning-ink);box-shadow:none}
.chip.add{box-shadow:inset 0 0 0 1.5px var(--control)}
.ctx .chip[data-act=clsset]{background:var(--brand-pale);box-shadow:none;color:var(--brand-ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;min-height:112px;border-radius:18px;border:1.5px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0;padding:10px 10px 11px;text-align:start;line-height:1.3;cursor:pointer;color:var(--text);border-color:#e3e9e6}
/* الاسم كاملاً بلا قصّ، في وسط المربع، ويلتف على أكثر من سطر عند الحاجة */
.tile .fn{font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere;text-align:center;margin-top:auto}
.tile .ln{font-size:12.5px;line-height:1.35;color:var(--muted);overflow-wrap:anywhere;text-align:center}
.tile .top{display:flex;align-items:center;justify-content:center;margin-top:auto;padding-top:6px}
.tile .st{font-size:11px;font-weight:500;margin-top:0;display:flex;align-items:baseline;gap:1px;direction:ltr}
.tile .st .num{font-size:13.5px;font-weight:700;color:var(--brand-ink)}
.tile .st .of{font-size:11px;color:var(--muted);direction:ltr}
.tile .bd{direction:ltr;position:absolute;top:-6px;left:-4px;min-width:22px;height:20px;border-radius:999px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 0 0 2px var(--ground)}
.tile.k-done{border-color:#7cc4a2} .tile.k-done .st{color:var(--positive)}
.tile.k-part{border-color:#efc66f} .tile.k-part .st{color:var(--pill-warning-ink)}
.tile.k-miss{border-color:#ee9d97} .tile.k-miss .st{color:var(--negative)}
.tile.k-full{border-color:#7cc4a2}
.tile.quiet{border:2px dashed #efc66f}
.tile.sel{border-color:var(--brand);z-index:1}
.tile:active{background:var(--raised)}
.pmrow{display:flex;gap:6px;width:100%;margin-top:6px;direction:ltr}
.pm{flex:1;min-height:44px;border-radius:var(--radius-control);border:0;font-size:23px;font-weight:500;line-height:1}
.pm.plus{background:var(--c,var(--brand));color:#fff}
.pm.minus{background:var(--c-pale,var(--brand-pale));color:var(--c-ink,var(--brand-ink))}
.pm.off{opacity:.3}
.tile.faded{opacity:.35}
.tile .p{color:var(--positive)} .tile .n{color:var(--negative)}
.tile.pulse{animation:pulse .3s ease}
.tile.shake{animation:shake .35s ease}
@keyframes pulse{40%{transform:scale(.95)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
textarea.names{width:100%;min-height:150px;border:1px solid var(--control);border-radius:var(--radius-inner);background:var(--surface);padding:10px 12px;line-height:1.8;resize:vertical}

/* شريط الكشف: الأربعون مقسومة إلى الفترتين، وكل جزء يمتلئ بما رُصد */
.lg{display:flex;gap:3px;height:6px;margin-top:8px;width:100%}
.lg i{display:block;height:100%;background:var(--track);border-radius:3px;overflow:hidden;min-width:0}
.lg b{display:block;height:100%;background:var(--brand);border-radius:3px}
.lg i:last-child b{background:#c98a17}

/* ---------- الرقم السري: تُحفظ بصمته فقط (SHA-256 مع معرّف المعلم) ---------- */
function normDigits(s){return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});}
function fnv(t){var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}
function pinHash(id,pin){
  var t='rasd-v2:'+id+':'+pin;
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return 'sha256:'+Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
  }
  return Promise.resolve('fnv:'+fnv(t));
}

/* ---------- الحساب ---------- */
function compGrade(c,sid){
  if(c.kind==='score'){var a=[];c.items.forEach(function(it){var v=(S.vals[it.id]||{})[sid];if(typeof v==='number'&&it.max)a.push(v/it.max);});return a.length?c.mark*a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  if(c.kind==='hand'){var b=[];c.items.forEach(function(it){var v=(S.vals[it.id]||{})[sid];if(v)b.push(v==='done'?1:v==='part'?.5:0);});return b.length?c.mark*b.reduce(function(x,y){return x+y;},0)/b.length:null;}
  /* العدّاد والسلوك: يبدآن من صفر، ومجموع اللمسات (+١ أو −١) × قيمة اللمسة، بين الصفر ودرجة العنصر. الملاحظات النصية (d=0) لا تؤثر */
  var e=evs(sid,c.id).filter(function(x){return x.d;});
  if(!e.length)return c.period==='1'?0:null;
  var n=e.reduce(function(a,x){return a+x.d;},0);
  return Math.max(0,Math.min(c.mark,n*c.per));
}
/* ترحيل بيانات النسخة السابقة: لمسات المشاركة القديمة = +١، وملاحظات السلوك القديمة تبقى ملاحظات بلا أثر في الدرجة */
function migrate(t){
  (t.classes||[]).forEach(function(k){var d=k.data,kinds={};
    d.subjects.forEach(function(sb){sb.comps.forEach(function(c){kinds[c.id]=c.kind;if(c.kind==='beh'&&!c.per)c.per=1;});});
    d.events.forEach(function(e){if(e.d===undefined)e.d=kinds[e.cid]==='count'?1:0;});
  });
  return t;
}

function ledgerBar(sb,sid,big){

  ['1','2'].forEach(function(p){var mx=r1(sb.comps.filter(function(c){return c.period===p;}).reduce(function(a,c){return a+c.mark;},0));if(!mx)return;
    var g=r1(gradeOf(sb,sid,p)),pc=Math.max(0,Math.min(100,g/mx*100));
    h+='<i style="flex:'+mx+'"><b style="width:'+pc.toFixed(1)+'%"></b></i>';
    l+='<span style="flex:'+mx+'">'+(p==='1'?'الأولى':'الثانية')+' <span class="num">'+g+'</span> من <span class="num">'+mx+'</span></span>';});
  return '<span class="lg'+(big?' big':'')+'" aria-hidden="true">'+h+'</span>'+(big?'<div class="lgl">'+l+'</div>':'');
}
function gradeOf(sb,sid,p){return sb.comps.filter(function(c){return !p||c.period===p;}).reduce(function(a,c){var g=compGrade(c,sid);return a+(g||0);},0);}

/* ---------- ملف PDF حقيقي يُصنع على الجهاز ----------
   في تطبيق الشاشة الرئيسية على آيفون لا تعمل window.print()، فلا يحدث شيء عند الضغط.
   لذلك تُرسم الورقة على لوحة رسم (canvas) بخط البرنامج نفسه، وتُجمع الصفحات في ملف PDF،
   ثم تُفتح قائمة المشاركة: «حفظ في الملفات» و«طباعة» والإرسال. وفي الحاسوب يُنزَّل الملف مباشرة.
   كل ذلك يجري متزامناً داخل لمسة الزر، لأن سفاري لا يفتح قائمة المشاركة إلا من لمسة مباشرة. */
var PDFX=2;/* دقة الرسم: ضعف مقاس الورقة (قرابة ١٩٢ نقطة في البوصة) */

/* النص يُحاط بعلامتي اتجاه من اليمين إلى اليسار حتى لا ينقلب ترتيب العربي مع الأرقام */
function pgRtl(t){return '‫'+String(t)+'‬';}
function pgW(g,t){return g.x.measureText(pgRtl(t)).width;}
/* كتابة سطر: a محاذاة (right / center / left)، ويُصغَّر الخط إن زاد النص عن العرض mw */
function pgText(g,t,x,y,a,col,w,s,mw){pgFont(g,w,s);while(mw&&s>8&&pgW(g,t)>mw){s-=.5;pgFont(g,w,s);}
  g.x.fillStyle=col||'#1b1b1b';g.x.textAlign=a||'right';g.x.fillText(pgRtl(t),x,y);}

function pgWrap(g,t,w,s,mw){pgFont(g,w,s);var out=[],line='';String(t).split(/\s+/).forEach(function(wd){var tr=line?line+' '+wd:wd;if(line&&pgW(g,tr)>mw){out.push(line);line=wd;}else line=tr;});if(line)out.push(line);return out;}

function pgCell(g,x,y,w,h,t,o){o=o||{};pgBox(g,x,y,w,h,o.bg,o.line);if(t===''||t==null)return;

function pdfKashf(sb){
  var P=sb.comps.filter(function(c){return c.period==='1';}),Q=sb.comps.filter(function(c){return c.period==='2';}),C=P.concat(Q);
  var L=40,R=1083,cw=[34,220],fix=34+220+76+76,each=(R-L-fix)/Math.max(1,C.length),rh=24,top=176,bottom=794-70,per=Math.max(1,Math.floor((bottom-top)/rh));

    if(P.length){pgCell(g,x-each*P.length,y,each*P.length,h1,'الستة أسابيع الأولى',{bg:'#3f5a48',col:'#fff',w:700});}
    P.forEach(function(c,k){pgCell(g,x-each*(k+1),y+h1,each,h2,c.name+' '+c.mark,{bg:'#f1f1ec',w:700,s:11.5,wrap:true});});x-=each*P.length;
    if(Q.length){pgCell(g,x-each*Q.length,y,each*Q.length,h1,'الستة أسابيع الثانية',{bg:'#8a6a45',col:'#fff',w:700});}
    Q.forEach(function(c,k){pgCell(g,x-each*(k+1),y+h1,each,h2,c.name+' '+c.mark,{bg:'#f1f1ec',w:700,s:11.5,wrap:true});});x-=each*Q.length;
    pgCell(g,x-76,y,76,h1+h2,'مجموع الأعمال ٤٠',{bg:'#f4efe2',w:700,s:12,wrap:true});x-=76;
    pgCell(g,x-76,y,76,h1+h2,tasT,{bg:'#e8f0ea',w:700,s:12,wrap:true});

    S.students.slice(pi*per,(pi+1)*per).forEach(function(s,j){var i=pi*per+j,yy=top+j*rh,z=i%2?'#f7f7f3':null,xx=R;
      pgCell(g,xx-34,yy,34,rh,i+1,{bg:z});xx-=34;
      pgCell(g,xx-220,yy,220,rh,s.name,{bg:z,right:true});xx-=220;
      C.forEach(function(c){var v=compGrade(c,s.id);pgCell(g,xx-each,yy,each,rh,v===null?'':r1(v),{bg:z});xx-=each;});
      pgCell(g,xx-76,yy,76,rh,r1(gradeOf(sb,s.id)),{bg:'#f4efe2',w:700});xx-=76;
      pgCell(g,xx-76,yy,76,rh,tasTotal(sb,s.id),{bg:'#e8f0ea'});});
    pages.push(g);}
  /* التوقيعات تحت آخر صف، وإن لم تتسع لها الصفحة الأخيرة تنتقل إلى صفحة جديدة */
  var last=pages[pages.length-1],yEnd=top+(S.students.length-(pages.length-1)*per)*rh+34;

}

/* جمع الصفحات في ملف PDF: كل صفحة صورة JPEG بمقاس A4 كامل */
function pdfBytes(pages){
  var parts=[],len=0,offs=[],n=pages.length,tot=3+n*3;

  function jpg(c){var d=atob(c.toDataURL('image/jpeg',.9).split(',')[1]),u=new Uint8Array(d.length);for(var i=0;i<d.length;i++)u[i]=d.charCodeAt(i);return u;}
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

  obj(2,['<< /Type /Pages /Kids ['+pages.map(function(p,i){return (3+i*3)+' 0 R';}).join(' ')+'] /Count '+n+' >>']);
  pages.forEach(function(p,i){var b=3+i*3,w=p.land?841.89:595.28,h=p.land?595.28:841.89,img=jpg(p.c),cs='q '+w+' 0 0 '+h+' 0 0 cm /Im0 Do Q';
    var iw=p.c.width,ih=p.c.height;p.c.width=p.c.height=0;/* تحرير ذاكرة اللوحة بعد ترميزها */
    obj(b,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h+'] /Resources << /XObject << /Im0 '+(b+2)+' 0 R >> >> /Contents '+(b+1)+' 0 R >>']);
    obj(b+1,['<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream']);
    obj(b+2,['<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n',img,'\nendstream']);});
  var xr=len;add('xref\n0 '+tot+'\n0000000000 65535 f \n');
  for(var k=1;k<tot;k++)add(('0000000000'+offs[k]).slice(-10)+' 00000 n \n');
  add('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  var out=new Uint8Array(len),o=0;parts.forEach(function(p){out.set(p,o);o+=p.length;});return out;
}

    else if(key==='imx'){var im2=null;S.subjects.forEach(function(sb){sb.comps.forEach(function(c){c.items.forEach(function(x){if(x.id===b.dataset.id)im2=x;});});});if(!im2)return false;im2.max=Math.max(.5,r1(im2.max+d*(im2.max<5?.5:1)));}
    else if(key==='itmax'){var ci=curComp(),im=curItem(ci);im.max=Math.max(.5,r1(im.max+d*(im.max<5?.5:1)));b.parentNode.querySelector('span').textContent=im.max;return true;}
    else if(key==='ncount'){S.newCount=Math.max(1,S.newCount+d);b.parentNode.querySelector('span').textContent=S.newCount;return false;}
    render(true);return true;
  }
  if(a==='kind'){var ck=compById(b.dataset.id);ck.kind=b.dataset.k;if(ck.kind==='score')ck.items.forEach(function(it){if(!it.max)it.max=ck.mark||1;});if((ck.kind==='score'||ck.kind==='hand')&&!ck.items.length){var ni={id:uid(),name:ck.kind==='hand'?'واجب ١':ck.name,max:ck.kind==='score'?(ck.mark||1):0,date:today()};ck.items.push(ni);S.vals[ni.id]={};}render(true);return true;}
  if(a==='addcomp'){if(worksSum()>=WORKS){refuse('المجموع مكتمل '+WORKS+' — أنقص عنصراً أولاً ليتسع لعنصر جديد');return false;}
    var p=b.dataset.p,sbz=sub(),ncm={id:uid(),name:'عنصر جديد',mark:.5,kind:'score',period:p,items:[],per:1,step:.5},it4={id:uid(),name:'عنصر جديد',max:10,date:today()};ncm.items.push(it4);S.vals[it4.id]={};
    var lastIx=-1;sbz.comps.forEach(function(c,i){if(c.period===p)lastIx=i;});sbz.comps.splice(lastIx+1,0,ncm);render(true);
    var inp=document.getElementById('n-'+ncm.id);if(inp){inp.scrollIntoView({block:'center'});inp.focus();inp.select();}return true;}
  if(a==='addit'){var ca=compById(b.dataset.cid),na=ca.items.length+1,last=ca.items[ca.items.length-1];
    var ni2={id:uid(),name:ca.kind==='hand'?'واجب '+na:ca.name+' '+na,max:ca.kind==='score'?(last?last.max:(ca.mark||10)):0,date:today()};
    ca.items.push(ni2);S.vals[ni2.id]={};S.sel[ca.id]=ni2.id;render(true);toast('أُضيف «'+esc(ni2.name)+'»');return true;}
  if(a==='delit'){var cdl=compById(b.dataset.cid),idl=cdl.items.findIndex(function(x){return x.id===b.dataset.id;});if(idl<0)return false;var gi=cdl.items.splice(idl,1)[0];if(S.sel[cdl.id]===gi.id)delete S.sel[cdl.id];render(true);
    toast('حُذف «'+esc(gi.name)+'» ودرجاته',function(){cdl.items.splice(idl,0,gi);});return true;}
  if(a==='delcomp'){var sbd=sub(),di=sbd.comps.findIndex(function(x){return x.id===b.dataset.id;}),gc=sbd.comps.splice(di,1)[0];render(true);toast('حُذف «'+esc(gc.name)+'»',function(){sbd.comps.splice(di,0,gc);});return true;}
  if(a==='addtas'){newTasSheet();return false;}
  if(a==='deltas'){var sbt=sub();if(sbt.tas.length<2){refuse('يلزم مقطع واحد على الأقل');return false;}var ti=sbt.tas.findIndex(function(x){return x.id===b.dataset.id;}),gt=sbt.tas.splice(ti,1)[0];render(true);toast('حُذف «'+esc(gt.name)+'»',function(){sbt.tas.splice(ti,0,gt);});return true;}
  if(a==='copydist'){var src=sub(),dst=other(),oldc=dst.comps;dst.comps=src.comps.map(function(c){return {id:uid(),name:c.name,mark:c.mark,kind:c.kind,period:c.period,per:c.per,step:c.step,items:c.items.map(function(it){var n={id:uid(),name:it.name,max:it.max,date:it.date};S.vals[n.id]={};return n;})};});
    S.cur=null;render(true);toast('نُسخ التوزيع إلى '+dst.name,function(){dst.comps=oldc;});return true;}
  if(a==='reset'){var sbr=sub(),oldr=sbr.comps;sbr.comps=standardComps();S.cur=null;render(true);toast('عاد توزيع '+sbr.short+' مطابقاً للكشف',function(){sbr.comps=oldr;});return true;}
  return false;
}
/* بعد كل عملية تغيّر البيانات يُحفظ حساب المعلم الحالي فوراً */
document.addEventListener('click',function(ev){var changed=onClick(ev);if(changed&&APP.tid)persistTeacher(teacher());});
/* منع تكبير اللمس المزدوج في آيفون (سفاري يتجاهل أحياناً touch-action):
   إذا جاءت لمسة ثانية ثابتة خلال ٣٥٠ مللي ثانية من الأولى أُلغي سلوكها الافتراضي (التكبير)، ونُفّذ زرها يدوياً
   حتى يبقى الضغط السريع المتكرر على + و − يعمل. السحب والتمرير وخانات الكتابة لا تتأثر */
var TAP={t:0,x:0,y:0};
document.addEventListener('touchstart',function(ev){var p=ev.touches[0];if(p){TAP.x=p.clientX;TAP.y=p.clientY;}},{passive:true});
document.addEventListener('touchend',function(ev){
  var now=Date.now(),p=ev.changedTouches[0],t=ev.target,still=p&&Math.abs(p.clientX-TAP.x)<10&&Math.abs(p.clientY-TAP.y)<10;
  if(!still||ev.touches.length){TAP.t=0;return;}
  if(now-TAP.t<350&&t.closest&&!t.closest('input,textarea,select')){
    ev.preventDefault();
    var b=t.closest('button,a,label,[data-act]');
    if(b&&!b.disabled&&!(b.dataset&&b.dataset.act==='shade'&&b!==t))b.click();
    TAP.t=now;return;}
  TAP.t=now;
},{passive:false});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t.dataset)return;
  if(t.classList.contains('pin')){t.value=normDigits(t.value).replace(/\D/g,'').slice(0,4);return;}
  if(!APP.tid||!S&&!t.dataset.clsname&&!t.dataset.sname)return;
  var changed=false;
  if(t.dataset.cname){var c=compById(t.dataset.cname);if(c){c.name=t.value;changed=true;}}
  if(t.dataset.tname){var x=tasById(t.dataset.tname);if(x){x.name=t.value;changed=true;}}
  if(t.dataset.itn){var cn=compById(t.dataset.cid),itn=cn&&cn.items.filter(function(i){return i.id===t.dataset.itn;})[0];if(itn){itn.name=t.value;changed=true;}}
  if(t.dataset.iname){var ci=curComp(),it=ci&&ci.items.filter(function(i){return i.id===t.dataset.iname;})[0];if(it){it.name=t.value;changed=true;}}
  if(t.dataset.tc){var y=tasById(t.dataset.tc),n=parseInt(normDigits(t.value),10);if(y&&n>=1){y.count=Math.min(300,n);changed=true;}}
  if(t.dataset.clsname){var kc=teacher().classes.filter(function(k){return k.id===t.dataset.clsname;})[0];if(kc){kc.data.cls=t.value;changed=true;}}
  if(t.dataset.sname){var kd=teacher().classes.filter(function(k){return k.id===t.dataset.cid;})[0],st=kd&&kd.data.students.filter(function(s){return s.id===t.dataset.sname;})[0];if(st){st.name=t.value;changed=true;}}
  if(changed)persistTeacher(teacher());
});
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t.dataset)return;
  if(t.dataset.tc)render(true);
  /* درجة من لوحة رصد الطالب: لا تُعاد رسم اللوحة كلها حتى لا تضيع اللمسة التالية، بل يُحدَّث المجموع ودرجة العنصر فقط */
  if(t.dataset.qsc&&S&&QS.sid){
    var it=null,c=compById(t.dataset.cid);if(c)it=c.items.filter(function(x){return x.id===t.dataset.qsc;})[0];if(!it)return;
    var vals=S.vals[it.id]||(S.vals[it.id]={}),raw=normDigits(t.value).replace(/[٫,]/g,'.').trim(),old=vals[QS.sid];
    if(raw===''){delete vals[QS.sid];}
    else{var v=Number(raw);
      if(isNaN(v)||v<0){refuse('اكتب رقماً صحيحاً');t.value=typeof old==='number'?old:'';return;}
      if(v>it.max){refuse('لا تُقبل: الدرجة العظمى '+it.max);t.value=typeof old==='number'?old:'';return;}
      vals[QS.sid]=v;t.value=v;}
    persistTeacher(teacher());render(true);
    var sb=sub(),g=compGrade(c,QS.sid),tot=document.getElementById('qstot'),gc=document.getElementById('qg-'+c.id);
    if(tot)tot.textContent=r1(gradeOf(sb,QS.sid));
    var lgx=document.getElementById('qslg');if(lgx)lgx.innerHTML=ledgerBar(sb,QS.sid,true);
    if(gc)gc.innerHTML=g===null?'<span class="dim small">لم يُرصد</span>':'<span class="num">'+r1(g)+'</span> <span class="dim small">من '+c.mark+'</span>';
  }
});
window.addEventListener('resize',fitPaper);
window.addEventListener('afterprint',fitPaper);

/* ---------- التشغيل ---------- */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
loadAll().then(function(list){APP.teachers=(list||[]).filter(function(t){return t&&t.id&&t.pin;}).map(migrate).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});APP.ui='login';render();});

/* العمل دون إنترنت: عامل الخدمة يحفظ ملفات البرنامج.
   التحديث: النسخة الجديدة تُثبَّت في الخلفية وتعمل فوراً؛ تُعاد الصفحة تلقائياً إن كان المعلم في شاشة الدخول،
   وإلا يظهر شريط ثابت «تحديث جاهز» حتى لا يُقطع عليه الرصد. البيانات محفوظة في كل الأحوال. */
var UPDATE_READY=false;
function updateBar(){
  if(document.getElementById('updbar'))return;
  var d=document.createElement('div');d.id='updbar';d.className='toast low';d.style.zIndex='45';d.style.top='calc(8px + env(safe-area-inset-top,0px))';d.style.bottom='auto';
  d.innerHTML='<span>نسخة جديدة من كشوفي جاهزة</span><button>تحديث الآن</button>';
  d.querySelector('button').onclick=function(){location.reload();};
  document.getElementById('dev').appendChild(d);
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
    reg.update().catch(function(){});
    /* عند العودة إلى البرنامج من الخلفية يُفحص التحديث مرة أخرى */
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){});});
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadController){hadController=true;return;}
    if(UPDATE_READY)return;UPDATE_READY=true;
    if(APP.ui==='login'||APP.ui==='loading'||APP.ui==='pin')location.reload();else updateBar();
  });
}
