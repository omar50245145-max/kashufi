<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كشوفي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef3ef">
<title>كشوفي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* كشوفي — الإصدار الثاني من «دفتر رصد الدرجات».
   التخطيط: عمود هاتف واحد — رأس، مادة وفترة، ثم شبكة الطلاب، وشريط عناصر الفترة ثابت تحت الإبهام.
   ألوان الفترتين من كشف المتابعة الورقي: أخضر داكن للأسابيع الأولى وبنّي للثانية. */
:root{
  --paper:#eef3ef; --sheet:#ffffff; --raise:#f6f8f5; --ink:#13221a; --ink-dim:#5a6b62;
  --rule:#dbe5de; --rule-strong:#b3c4b9;
  --green:#1f6b4f; --green-2:#2f8a67; --green-soft:#e1efe7; --on-green:#ffffff;
  --p1:#3f5a48; --p2:#8a6a45; --p1-soft:#e3ebe5; --p2-soft:#f3ebe0; --tot-soft:#f4efe2;
  --red:#b3261e; --red-soft:#fbe9e7; --amber:#8a5a00; --amber-soft:#fcefd2;
  --shade:rgba(10,22,16,.42);
  --shadow:0 1px 2px rgba(19,34,26,.06),0 4px 14px rgba(19,34,26,.06);
  --display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0e1511; --sheet:#17201b; --raise:#1c2620; --ink:#e6eee9; --ink-dim:#9bb0a4;
    --rule:#26332c; --rule-strong:#3d5146;
    --green:#6fcfa5; --green-2:#8fe0bb; --green-soft:#1c3328; --on-green:#0b1a12;
    --p1:#8fc0a0; --p2:#d9b07e; --p1-soft:#1d2b22; --p2-soft:#2e2519; --tot-soft:#2b2618;
    --red:#ff8a80; --red-soft:#3a1f1d; --amber:#f2c260; --amber-soft:#35290f;
    --shade:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.dim{color:var(--ink-dim)}
.small{font-size:13px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* الإطار */
.app{position:relative;max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.scr{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:24px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.scr>*{min-width:0;flex:0 0 auto}

/* الرأس */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd .t{display:flex;flex-direction:column;min-width:0}
.hd h1{font-family:var(--display);font-size:28px;font-weight:700;color:var(--green)}
.hd h2{font-size:20px;font-weight:700}
.iconbtn{min-width:44px;min-height:44px;border-radius:14px;border:0;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:600;font-size:14px;flex:0 0 auto}
.saved{font-size:12.5px;color:var(--green);font-weight:600}
.saved.bad{color:var(--red)}

/* عام */
.card{background:var(--sheet);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.btn{min-height:46px;border-radius:14px;border:1px solid var(--rule-strong);background:var(--sheet);padding:8px 16px;font-weight:600}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.soft{background:var(--green-soft);border-color:transparent;color:var(--green)}
.btn.dash{border-style:dashed;border-width:1.5px;color:var(--green);background:transparent;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.plain{background:transparent;border:0;color:var(--ink-dim)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row>*{min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--raise);border:1px solid var(--rule);border-radius:12px;padding:3px}
.seg button{border:0;border-radius:9px;background:transparent;min-height:38px;font-size:13.5px;font-weight:600;color:var(--ink-dim);padding:0 4px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sheet);color:var(--green);box-shadow:var(--shadow)}
.seg.per button[aria-pressed=true][data-p="1"]{color:var(--p1)}
.seg.per button[aria-pressed=true][data-p="2"]{color:var(--p2)}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subj button{min-height:48px;border-radius:14px;border:1.5px solid var(--rule-strong);background:var(--sheet);font-weight:700;font-size:15px}
.subj button[aria-pressed=true]{border-color:var(--green);background:var(--green);color:var(--on-green)}
.sec{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding-top:6px}
.sec i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sec .s{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--ink-dim)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.pill.p1{background:var(--p1-soft);color:var(--p1)} .pill.p2{background:var(--p2-soft);color:var(--p2)}

/* المعلم والتنبيهات */
.who-t{display:flex;align-items:center;gap:10px;background:var(--sheet);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;flex:0 0 auto}
.who-t .tx{flex:1;min-width:0;line-height:1.35}
.who-t button{min-height:40px;border-radius:12px;border:1px solid var(--rule-strong);background:transparent;font-weight:600;font-size:13.5px;padding:0 12px;color:var(--green)}
.bk{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;background:var(--amber-soft);color:var(--amber)}
.bk .tx{flex:1;font-size:14px;line-height:1.5}
.bk button{min-height:40px;border-radius:12px;border:1px solid var(--amber);background:transparent;color:var(--amber);font-weight:700;padding:0 12px;flex:0 0 auto}
.bk.ok{background:var(--green-soft);color:var(--green)}
.bk.red{background:var(--red-soft);color:var(--red)} .bk.red button{border-color:var(--red);color:var(--red)}
.install{border-radius:16px;padding:14px;background:var(--amber-soft);color:var(--amber);display:flex;flex-direction:column;gap:8px;font-size:14px}
.install ol{margin:0;padding-inline-start:20px;line-height:1.9}

/* الصفوف */
.ccard{background:var(--sheet);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent}
.ccard.cur{border-color:var(--green)}
.ccard .nm{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2}
.sbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sbtns button{min-height:58px;border-radius:14px;border:0;color:#fff;font-weight:700;font-size:15px;text-align:start;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;line-height:1.3}
.sbtns button small{font-weight:500;font-size:12px;opacity:.85}
.sbtns .isl{background:linear-gradient(160deg,#2f8a67,#1f6b4f)}
.sbtns .qur{background:linear-gradient(160deg,#a07c52,#7a5a36)}

/* الدخول */
.login{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.login .brand{text-align:center;display:flex;flex-direction:column;gap:2px;padding-top:12px}
.login .brand h1{font-family:var(--display);font-size:36px;color:var(--green)}
.tlist{display:flex;flex-direction:column;gap:8px}
.tlist button{display:flex;align-items:center;gap:12px;min-height:68px;border-radius:16px;border:1.5px solid transparent;background:var(--sheet);box-shadow:var(--shadow);padding:10px 14px;text-align:start}
.tlist .tx{flex:1;min-width:0;line-height:1.4}
.pinbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:16px}
.pinbox .av{width:72px;height:72px;font-size:30px}
.dots{display:flex;gap:16px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--green);display:block}
.dots i.on{background:var(--green)}
.dots.err i{border-color:var(--red)}
.dots.err{animation:shake .35s ease}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr;justify-content:center}
.pinpad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--sheet);box-shadow:var(--shadow);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.pinpad button.ghost{background:transparent;box-shadow:none;font-size:15px;color:var(--green)}
.pinmsg{min-height:22px;font-size:14px;font-weight:600;color:var(--red);text-align:center}
input.pin{direction:ltr;text-align:center;letter-spacing:10px;font-size:22px;font-weight:700;-webkit-text-security:disc}

/* الإعدادات */
.comp{background:var(--sheet);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-inline-start:4px solid var(--p1)}
.comp.p2{border-inline-start-color:var(--p2)} .comp.pt{border-inline-start-color:var(--green-2)}
.cname{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--rule-strong);background:transparent;padding:4px 2px;font-size:16px;font-weight:700;min-height:42px;border-radius:0}
.cname:focus{border-bottom-color:var(--green);outline:none}
.del{min-width:42px;min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--ink-dim);display:inline-flex;align-items:center;justify-content:center}
.del.armed{background:var(--red);color:#fff}
.kdesc{font-size:12.5px;color:var(--ink-dim);margin-top:-4px}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule-strong);border-radius:12px;overflow:hidden;direction:ltr;flex:0 0 auto}
.step button{min-width:42px;min-height:40px;border:0;background:var(--raise);font-size:20px;font-weight:600;color:var(--green)}
.step button[disabled]{color:var(--rule-strong);cursor:not-allowed}
.step span,.step input{min-width:50px;width:58px;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;border:0;background:transparent;min-height:40px;padding:0}
.sumbar{position:sticky;bottom:0;background:var(--sheet);border-radius:18px;box-shadow:0 -2px 14px rgba(19,34,26,.10);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sumbar .sv{font-family:var(--display);font-size:22px;font-weight:700}
.ok{color:var(--green)} .bad{color:var(--red)}
.srow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--rule);padding:2px 0}
.srow .i{width:26px;text-align:center;color:var(--ink-dim);font-size:13px;flex:0 0 auto}
.srow input{flex:1;min-width:0;border:0;background:transparent;min-height:42px;padding:0 4px}

/* شبكة الفصل */
.ctx{background:var(--sheet);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ctx .ttl{display:flex;align-items:center;gap:8px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--sheet);padding:0 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.chip.add{border-style:dashed;color:var(--green);border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;min-height:84px;border-radius:16px;border:1.5px solid transparent;background:var(--sheet);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;text-align:center;line-height:1.3;transition:transform .12s ease}
.tile .fn{font-weight:700;font-size:15px}
.tile .ln{font-size:12px;color:var(--ink-dim)}
.tile .st{font-size:12.5px;font-weight:700;margin-top:3px}
.tile .bd{direction:ltr;position:absolute;top:6px;inset-inline-start:6px;min-width:24px;height:22px;border-radius:999px;background:var(--green);color:var(--on-green);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;font-variant-numeric:tabular-nums}
.tile.k-done{background:var(--green-soft);border-color:var(--green)} .tile.k-done .st{color:var(--green)}
.tile.k-part{background:var(--amber-soft);border-color:var(--amber)} .tile.k-part .st{color:var(--amber)}
.tile.k-miss{background:var(--red-soft);border-color:var(--red)} .tile.k-miss .st{color:var(--red)}
.tile.k-full{background:var(--green-soft);border-color:var(--green)} .tile.k-full .st{color:var(--green)}
.tile.quiet{border:2px dashed var(--amber)}
.tile.faded{opacity:.35}
.tile .p{color:var(--green)} .tile .n{color:var(--red)}
.tile.pulse{animation:pulse .3s ease}
.tile.shake{animation:shake .35s ease}
@keyframes pulse{40%{transform:scale(.92)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
textarea.names{width:100%;min-height:150px;border:1px solid var(--rule-strong);border-radius:14px;background:var(--sheet);padding:10px 12px;line-height:1.8;resize:vertical}

/* شريط العناصر */
.tabbar{flex:0 0 auto;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:flex;overflow-x:auto;scrollbar-width:none}
.tabbar .in::-webkit-scrollbar{display:none}
.tabbar button{flex:1 0 72px;min-height:64px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-dim);padding:6px 4px;line-height:1.2;position:relative}
.tabbar button span{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button[aria-pressed=true]{color:var(--green)}
.tabbar button[aria-pressed=true]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.tabbar .sep{flex:0 0 1px;background:var(--rule);margin:12px 0}

/* رصد الدرجات */
.who{display:flex;flex-direction:column;align-items:center;text-align:center}
.who b{font-size:24px}
.disp{font-family:var(--display);font-size:46px;font-weight:700;text-align:center;min-height:78px;line-height:76px;background:var(--sheet);border:2px solid var(--green);border-radius:20px;font-variant-numeric:tabular-nums;direction:ltr}
.disp.bad{border-color:var(--red);color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.pad button{min-height:54px;border-radius:14px;border:0;background:var(--sheet);box-shadow:var(--shadow);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.pad button.w{font-size:14.5px;color:var(--green)}
.pad button.on{background:var(--amber-soft);color:var(--amber)}
.pad button.go{grid-column:span 2;background:var(--green);color:var(--on-green);font-size:16px}
.pad button[disabled]{opacity:.35;cursor:not-allowed}
.slist{background:var(--sheet);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.slist button{display:flex;justify-content:space-between;align-items:center;min-height:48px;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:0 14px;text-align:start}
.slist button:last-child{border-bottom:0}
.slist button.cur{background:var(--green-soft);font-weight:700}
.slist .v{font-weight:700;font-variant-numeric:tabular-nums}
.slist .v.abs{color:var(--red)}

/* بطاقة الطالب */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .c b{font-family:var(--display);font-size:28px;color:var(--green)}
.parts{display:flex;flex-direction:column;gap:10px}
.part .row{font-size:14px}
.mt{height:7px;border-radius:999px;background:var(--raise);overflow:hidden;margin-top:3px}
.mt i{display:block;height:100%;border-radius:999px;background:var(--p1)}
.mt.p2 i{background:var(--p2)}
.mt.low i{background:var(--red)}
.tcount{display:flex;align-items:baseline;gap:8px}
.tcount b{font-family:var(--display);font-size:34px;color:var(--green);line-height:1}
.tl{display:flex;flex-direction:column}
.tl .day{font-size:12.5px;font-weight:700;color:var(--ink-dim);padding-top:10px}
.tl .ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.tl .k{flex:0 0 auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--green-soft);color:var(--green);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .k.neg{background:var(--red-soft);color:var(--red)} .tl .k.mid{background:var(--amber-soft);color:var(--amber)}
.tl .tx{flex:1;min-width:0}
.tl .x{min-width:36px;min-height:36px;border:0;background:transparent;color:var(--ink-dim);font-size:18px}

/* الكشف */
.kwrap{overflow-x:auto;border-radius:14px;box-shadow:var(--shadow);background:var(--sheet)}
table.k{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
table.k th,table.k td{border:1px solid var(--rule);padding:5px 6px;text-align:center;white-space:nowrap}
table.k thead th{font-weight:700;line-height:1.35}
table.k th.g1{background:var(--p1);color:#fff} table.k th.g2{background:var(--p2);color:#fff}
table.k th.h1{background:var(--p1-soft)} table.k th.h2{background:var(--p2-soft)}
table.k th.ht,table.k td.ct{background:var(--tot-soft);font-weight:700}
table.k th.hq,table.k td.cq{background:var(--green-soft);color:var(--green)}
table.k .nm{position:sticky;right:0;z-index:1;text-align:start;background:var(--sheet);min-width:118px;box-shadow:-1px 0 0 var(--rule-strong)}
table.k thead .nm{background:var(--p1);color:#fff;z-index:2}
table.k td.e{color:var(--ink-dim)}
table.k tbody tr:nth-child(even) td{background:var(--raise)}
table.k tbody tr:nth-child(even) td.ct{background:var(--tot-soft)} table.k tbody tr:nth-child(even) td.cq{background:var(--green-soft)}

/* صفحة PDF: ورقة بيضاء دائماً مثل الورق المطبوع */
.paperwrap{position:relative;width:100%;overflow:hidden;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#ffffff}
.paper{position:absolute;top:0;right:0;transform-origin:top right;background:#ffffff;color:#1b1b1b;font-family:var(--body);padding:40px;direction:rtl}
.paper.land{width:1123px;min-height:794px}
.paper.port{width:794px;min-height:1123px}
.paper h1{font-family:var(--display);font-size:32px;font-weight:700;color:#1b1b1b;text-align:center}
.paper h1 small{font-family:var(--body);font-size:20px;font-weight:600;margin-inline-start:24px}
.paper .meta{display:flex;justify-content:space-between;font-size:15px;color:#555;margin:6px 0 16px}
.paper table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.paper th,.paper td{border:1px solid #cfcfc8;padding:5px 6px;text-align:center;line-height:1.35}
.paper thead th{background:#f1f1ec;font-weight:700;color:#1b1b1b}
.paper th.g1,.paper th.nm{background:#3f5a48;color:#ffffff}
.paper th.g2{background:#8a6a45;color:#ffffff}
.paper td.nm{text-align:start;white-space:nowrap}
.paper td.ct,.paper th.ct{background:#f4efe2;font-weight:700}
.paper td.cq,.paper th.cq{background:#e8f0ea}
.paper tbody tr:nth-child(even) td{background:#f7f7f3}
.paper tbody tr:nth-child(even) td.ct{background:#f4efe2} .paper tbody tr:nth-child(even) td.cq{background:#e8f0ea}
.paper .foot{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-top:28px}
.paper .big{display:flex;gap:16px;margin:18px 0}
.paper .big div{flex:1;border:1px solid #cfcfc8;border-radius:10px;padding:12px 16px;display:flex;flex-direction:column}
.paper .big b{font-family:var(--display);font-size:34px;color:#1f6b4f}
.paper .big small{font-size:18px;color:#555;font-family:var(--body)}
.paper h3{font-size:19px;margin:18px 0 8px;color:#1b1b1b}
.paper ul{margin:0;padding-inline-start:22px;font-size:15px;line-height:1.9}

/* اللوحات السفلية */
.layer{position:absolute;inset:0;z-index:30;background:var(--shade);display:flex;align-items:flex-end}
.sheetp{width:100%;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheetp .grab{width:40px;height:5px;border-radius:5px;background:var(--rule-strong);align-self:center;flex:0 0 auto}
.sheetp input[type=text]{width:100%;min-height:46px;border:1px solid var(--rule-strong);border-radius:12px;background:var(--sheet);padding:8px 12px}
.bchips{display:flex;flex-wrap:wrap;gap:8px}
.bchips button{min-height:44px;border-radius:999px;background:var(--sheet);padding:0 14px;font-size:14px;font-weight:600}
.bchips.pos button{border:1.5px solid var(--green);color:var(--green)}
.bchips.neg button{border:1.5px solid var(--red);color:var(--red)}
.units{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:ltr}
.units button{min-height:44px;border-radius:12px;border:1px solid var(--rule-strong);background:var(--sheet);font-weight:700;font-variant-numeric:tabular-nums}
.units button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--on-green)}

/* الرسائل */
.toast{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.low{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast.warn{background:var(--red);color:#fff}
.toast button{min-height:38px;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0 8px;flex:0 0 auto}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--ink-dim)}
@media (prefers-reduced-motion: reduce){.tile{transition:none}.tile.pulse,.tile.shake,.dots.err{animation:none}}

/* الطباعة وحفظ PDF: تظهر الورقة وحدها */
@media print{
  html,body{height:auto;background:#fff}
  .app{display:block;height:auto;max-width:none;overflow:visible;background:#fff}
  .tabbar,#layer,.toast,.noprint{display:none!important}
  .scr{display:block;overflow:visible;padding:0}
  .scr>*:not(#pw){display:none!important}
  #pw{box-shadow:none;border-radius:0;height:auto!important;overflow:visible}
  .paper{position:static;transform:none!important;width:auto!important;min-height:0!important;padding:0}
  .paper tr{break-inside:avoid}
}

<script>
/* كشوفي — الإصدار الثاني من «دفتر رصد الدرجات»
   البنية: معلمون ← لكل معلم صفوفه ← لكل صف مادتاه وطلابه ورصده، وكلٌّ مستقل عن غيره.
   الدخول: يختار المعلم اسمه ويدخل رقمه السري (تُحفظ بصمته فقط).
   الحفظ: كل إدخال يُحفظ فوراً في قاعدة IndexedDB على الجهاز (وعند تعذّرها localStorage)، ولا يغادر الجهاز.
   الأعمال من ٤٠ بتوزيع كشف المتابعة، والتسميع عدد لا يدخل في المجموع، ولا تُقبل درجة تتجاوز حد عنصرها. */
var WORKS=40;
var DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var PER={'1':'الستة أسابيع الأولى','2':'الستة أسابيع الثانية'};
var PSHORT={'1':'الأسابيع الأولى','2':'الأسابيع الثانية'};
var KINDS={
  score:{l:'درجات',d:'تُرصد بالدرجة — وإن تعددت التقييمات يُحسب متوسطها'},
  hand:{l:'تسليم',d:'سلّم = كاملة · ناقص = نصف · لم يسلّم = صفر'},
  count:{l:'عدّاد',d:'كل لمسة تضيف قيمة ثابتة، وتتوقف عند درجة العنصر'},
  beh:{l:'سلوك',d:'يبدأ بالدرجة الكاملة ويُخصم منه، ولا يتجاوزها'}
};
function svg(p){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';}
var IC={
  score:svg('<path d="M7 3h8l3 3v15H7z"/><path d="M10 10h5M10 14h5M10 18h3"/>'),
  hand:svg('<circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.4l2.5 2.5 5-5.3"/>'),
  count:svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 8.2v7.6M8.2 12h7.6"/>'),
  beh:svg('<path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.6l-5.1 2.6 1-5.6-4.1-4 5.7-.8z"/>'),
  tas:svg('<path d="M4 5.5c2.8-1.2 5.5-1 8 .8 2.5-1.8 5.2-2 8-.8V19c-2.8-1.2-5.5-1-8 .8-2.5-1.8-5.2-2-8-.8z"/><path d="M12 6.3V19.8"/>'),
  file:svg('<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1.4-3.7 4.2-5.6 7.5-5.6s6.1 1.9 7.5 5.6"/>'),
  set:svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
  sheet:svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9 9.5v10M14.5 9.5v10"/>'),
  trash:svg('<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>')
};

/* ---------- التاريخ ---------- */
function pad2(n){return (n<10?'0':'')+n;}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function today(){return ymd();}
function weekStart(){var d=new Date();d.setDate(d.getDate()-d.getDay());return ymd(d);}
function fd(s){var x=new Date(s+'T12:00:00');return DAYS[x.getDay()]+' '+x.getDate()+' '+MONTHS[x.getMonth()];}

/* ---------- نموذج البيانات ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
/* التوزيع المطابق للكشف: لكل فترة سلوك ٣ + مشاركة ٣ + واجبات ٣ + مشروع ٣٫٥، والقصير ١٥ في الفترة الثانية = ٤٠ */
function standardComps(){
  function c(name,mark,kind,period,items){return {id:uid(),name:name,mark:mark,kind:kind,period:period,items:items||[],per:1,step:.5};}
  function it(name,max){return {id:uid(),name:name,max:max,date:today()};}
  return [
    c('السلوك',3,'beh','1'),c('المشاركة',3,'count','1'),c('الواجبات',3,'hand','1',[it('واجب ١',0)]),c('المشروع',3.5,'score','1',[it('المشروع',3.5)]),
    c('السلوك',3,'beh','2'),c('المشاركة',3,'count','2'),c('الواجبات',3,'hand','2',[it('واجب ١',0)]),c('المشروع',3.5,'score','2',[it('المشروع',3.5)]),c('الاختبار القصير',15,'score','2',[it('الاختبار القصير',15)])
  ];
}
var SUBJ_DEF={
  isl:function(){return {id:'isl',name:'التربية الإسلامية',short:'الإسلامية',tasName:'تسميع الأحاديث',unit:'حديث',range:false,comps:standardComps(),tas:[{id:uid(),name:'أحاديث الفترة الأولى',count:6},{id:uid(),name:'أحاديث الفترة الثانية',count:6}]};},
  qur:function(){return {id:'qur',name:'القرآن الكريم',short:'القرآن',tasName:'تسميع الآيات',unit:'آية',range:true,comps:standardComps(),tas:[{id:uid(),name:'سورة …',count:10}]};}
};
function blankData(cls,ids){
  ids=ids||['isl','qur'];
  return {view:'grid',subj:ids[0],period:'1',cur:null,sel:{},sid:null,ent:{idx:0,half:false,buf:''},quietOnly:false,cls:cls,
    subjects:ids.map(function(k){return SUBJ_DEF[k]();}),students:[],vals:{},events:[],tv:{}};
}

/* ---------- الرقم السري: تُحفظ بصمته فقط (SHA-256 مع معرّف المعلم) ---------- */
function normDigits(s){return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});}
function fnv(t){var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}
function pinHash(id,pin){
  var t='rasd-v2:'+id+':'+pin;
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return 'sha256:'+Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
  }
  return Promise.resolve('fnv:'+fnv(t));
}

/* ---------- التخزين: قاعدة IndexedDB، سجل لكل معلم ---------- */
var DB=null,LSK='rasd-v2:',SAVE={ok:true};
function idbOpen(){return new Promise(function(res,rej){try{var r=indexedDB.open('rasd-v2',1);r.onupgradeneeded=function(){r.result.createObjectStore('teachers',{keyPath:'id'});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function loadAll(){
  return idbOpen().then(function(db){DB=db;return new Promise(function(res,rej){var q=db.transaction('teachers').objectStore('teachers').getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};});})
  .catch(function(){DB=null;var out=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf(LSK)===0)out.push(JSON.parse(localStorage.getItem(k)));}}catch(e){}return out;});
}
function persistTeacher(t){
  if(!t)return;
  var copy=JSON.parse(JSON.stringify(t));
  if(DB){try{var tx=DB.transaction('teachers','readwrite');tx.objectStore('teachers').put(copy);tx.oncomplete=function(){markSaved(true);};tx.onerror=tx.onabort=function(){fallbackLS(copy);};return;}catch(e){}}
  fallbackLS(copy);
}
function fallbackLS(copy){try{localStorage.setItem(LSK+copy.id,JSON.stringify(copy));markSaved(true);}catch(e){markSaved(false);}}
function removeTeacher(id){if(DB){try{DB.transaction('teachers','readwrite').objectStore('teachers').delete(id);}catch(e){}}try{localStorage.removeItem(LSK+id);}catch(e){}}
function markSaved(ok){SAVE.ok=ok;var el=document.getElementById('savedot');if(el){el.className='saved'+(ok?'':' bad');el.textContent=ok?'✓ محفوظ على هذا الجهاز':'⚠ لم يُحفظ — احفظ نسخة احتياطية الآن';}}
function savedNote(){return '<span id="savedot" class="saved'+(SAVE.ok?'':' bad')+'">'+(SAVE.ok?'✓ محفوظ على هذا الجهاز':'⚠ لم يُحفظ — احفظ نسخة احتياطية الآن')+'</span>';}

/* ---------- الحالة ---------- */
var APP={ui:'loading',tid:null,teachers:[]},S=null,PIN={tid:null,buf:'',err:''};
function teacher(){return APP.teachers.filter(function(t){return t.id===APP.tid;})[0]||null;}
function klass(){var t=teacher();if(!t)return null;return t.classes.filter(function(c){return c.id===t.cid;})[0]||t.classes[0]||null;}
function bind(){var k=klass();S=k?k.data:null;}
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}

/* ---------- أدوات ---------- */
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* اسم الصف مثل «١٠ / ٣» يُعزل اتجاهه حتى لا ينقلب بجوار النص العربي */
function cn_(x){return '<bdi dir="ltr">'+esc(x)+'</bdi>';}
function r1(x){return Math.round(x*10)/10;}
function sub(){return S.subjects.filter(function(s){return s.id===S.subj;})[0]||S.subjects[0];}
function other(){return S.subjects.filter(function(s){return s.id!==sub().id;})[0];}
function comps(p){return sub().comps.filter(function(c){return !p||c.period===p;});}
function compById(id){var o=null;S.subjects.forEach(function(sb){sb.comps.forEach(function(c){if(c.id===id)o=c;});});return o;}
function tasById(id){var o=null;S.subjects.forEach(function(sb){sb.tas.forEach(function(t){if(t.id===id)o=t;});});return o;}
function stu(id){return S.students.filter(function(s){return s.id===id;})[0];}
function curComp(){return compById(S.cur);}
function curItem(c){var id=S.sel[c.id];var it=c.items.filter(function(x){return x.id===id;})[0];return it||c.items[c.items.length-1];}
function curTas(){var sb=sub(),id=S.sel['tas-'+sb.id];return sb.tas.filter(function(t){return t.id===id;})[0]||sb.tas[0];}
function evs(sid,cid,since){return S.events.filter(function(e){return e.sid===sid&&e.cid===cid&&(!since||e.date>=since);});}
function first(n){return n.split(' ')[0];}
function rest(n){return n.split(' ').slice(1).join(' ');}
function worksSum(sb){return r1((sb||sub()).comps.reduce(function(a,c){return a+c.mark;},0));}
function tasDone(t,sid){return ((S.tv[t.id]||{})[sid]||[]).length;}
function tasTotal(sb,sid){return sb.tas.reduce(function(a,t){return a+tasDone(t,sid);},0);}
function ensureCur(){if(S.cur==='tas'||S.cur==='file')return;var c=curComp();if(!c||c.period!==S.period||sub().comps.indexOf(c)<0){var l=comps(S.period);S.cur=l.length?l[0].id:'tas';}}
function initial(n){return n.replace(/^أ\.\s*/,'').charAt(0)||'؟';}
function backupDays(t){var b=t.lastBackup||t.createdAt||Date.now();return Math.floor((Date.now()-b)/86400000);}

/* ---------- الحساب ---------- */
function compGrade(c,sid){
  if(c.kind==='score'){var a=[];c.items.forEach(function(it){var v=(S.vals[it.id]||{})[sid];if(typeof v==='number'&&it.max)a.push(v/it.max);});return a.length?c.mark*a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  if(c.kind==='hand'){var b=[];c.items.forEach(function(it){var v=(S.vals[it.id]||{})[sid];if(v)b.push(v==='done'?1:v==='part'?.5:0);});return b.length?c.mark*b.reduce(function(x,y){return x+y;},0)/b.length:null;}
  if(c.kind==='count'){var n=evs(sid,c.id).length;if(!n)return c.period==='1'?0:null;return Math.min(c.mark,n*c.per);}
  var e=evs(sid,c.id),neg=e.filter(function(x){return x.pol==='-';}).length,pos=e.length-neg;
  if(c.period!=='1'&&!e.length)return null;
  return Math.max(0,Math.min(c.mark,c.mark-neg*c.step+pos*c.step));
}
function gradeOf(sb,sid,p){return sb.comps.filter(function(c){return !p||c.period===p;}).reduce(function(a,c){var g=compGrade(c,sid);return a+(g||0);},0);}

/* ---------- عناصر مشتركة ---------- */
function hd(title,subt,back,extra){
  return '<div class="hd"><div class="row" style="justify-content:flex-start;gap:10px">'+(back?'<button class="iconbtn" data-act="'+(back==='home'?'home':'go')+'" data-to="'+back+'" aria-label="رجوع">→</button>':'')+'<div class="t"><h2>'+title+'</h2>'+(subt?'<span class="small dim">'+subt+'</span>':'')+'</div></div>'+(extra?'<div class="row" style="gap:6px">'+extra+'</div>':'')+'</div>';
}
function stepper(key,id,val,canUp){
  return '<div class="step"><button data-act="st" data-k="'+key+'" data-id="'+id+'" data-d="-1" aria-label="إنقاص">−</button><span>'+val+'</span><button data-act="st" data-k="'+key+'" data-id="'+id+'" data-d="1" aria-label="زيادة"'+(canUp===false?' disabled':'')+'>+</button></div>';
}
function subjSwitch(){if(S.subjects.length<2)return '';return '<div class="subj" role="group" aria-label="المادة">'+S.subjects.map(function(sb){return '<button data-act="subj" data-id="'+sb.id+'" aria-pressed="'+(sb.id===sub().id)+'">'+sb.name+'</button>';}).join('')+'</div>';}
function perSwitch(){return '<div class="seg per" role="group" aria-label="الفترة">'+['1','2'].map(function(p){return '<button data-act="per" data-p="'+p+'" aria-pressed="'+(S.period===p)+'">'+PER[p]+'</button>';}).join('')+'</div>';}

/* ---------- البيانات القديمة (الإصدار الأول) ---------- */
function v1Classes(){
  var out=[];
  try{
    var P=JSON.parse(localStorage.getItem('rasd-teachers-v1')||'[]')||[],keys=P.map(function(p){return 'rasd-grades-v1:'+p.id;});keys.push('rasd-grades-v1');
    keys.forEach(function(k){var t=localStorage.getItem(k);if(!t)return;var d=JSON.parse(t);(d.classes||[]).forEach(function(c){if(c.students&&c.students.length)out.push({name:c.name||'فصل',names:c.students.map(function(s){return s.name;}).filter(Boolean)});});});
  }catch(e){}
  return out;
}

/* ---------- الشاشات ---------- */
function vLogin(){
  var inst=standalone()?'':'<div class="install"><b>ثبّت البرنامج أولاً ليعمل دون إنترنت ولا تضيع بياناتك</b><ol><li>اضغط زر المشاركة في سفاري (المربع والسهم).</li><li>اختر «إضافة إلى الشاشة الرئيسية».</li><li>افتح «كشوفي» من الأيقونة وأنشئ حسابك هناك.</li></ol><span class="small">ما يُدخل في سفاري يبقى في سفاري، ولا يظهر في الأيقونة.</span></div>';
  var list=APP.teachers.length?'<div class="tlist">'+APP.teachers.map(function(t){return '<button data-act="pickt" data-id="'+t.id+'"><span class="av">'+esc(initial(t.name))+'</span><span class="tx"><b>'+esc(t.name)+'</b><br><span class="small dim"><span class="num">'+t.classes.length+'</span> صفوف</span></span><span class="dim">←</span></button>';}).join('')+'</div>'

var toastT;

  document.getElementById('dev').appendChild(d);

}

function shareFile(name,text,mime){
  var f=null;try{f=new File([text],name,{type:mime});}catch(e){}
  function download(){var u=URL.createObjectURL(new Blob([text],{type:mime}));var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);return true;}
  if(f&&navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).then(function(){return true;},function(e){return e&&e.name==='AbortError'?false:download();});}catch(e){}}
  return Promise.resolve(download());
}
function doBackup(){
  var t=teacher(),payload={app:'rasd-v2',v:1,exportedAt:new Date().toISOString(),teacher:t};
  shareFile('كشوفي-'+today()+'.json',JSON.stringify(payload),'application/json').then(function(ok){if(ok){t.lastBackup=Date.now();persistTeacher(t);render(true);toast('✓ حُفظت النسخة الاحتياطية');}});
}

  return false;
}
/* بعد كل عملية تغيّر البيانات يُحفظ حساب المعلم الحالي فوراً */
document.addEventListener('click',function(ev){var changed=onClick(ev);if(changed&&APP.tid)persistTeacher(teacher());});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t.dataset)return;
  if(t.classList.contains('pin')){t.value=normDigits(t.value).replace(/\D/g,'').slice(0,4);return;}
  if(!APP.tid||!S&&!t.dataset.clsname&&!t.dataset.sname)return;
  var changed=false;
  if(t.dataset.cname){var c=compById(t.dataset.cname);if(c){c.name=t.value;changed=true;}}
  if(t.dataset.tname){var x=tasById(t.dataset.tname);if(x){x.name=t.value;changed=true;}}
  if(t.dataset.iname){var ci=curComp(),it=ci&&ci.items.filter(function(i){return i.id===t.dataset.iname;})[0];if(it){it.name=t.value;changed=true;}}
  if(t.dataset.tc){var y=tasById(t.dataset.tc),n=parseInt(normDigits(t.value),10);if(y&&n>=1){y.count=Math.min(300,n);changed=true;}}
  if(t.dataset.clsname){var kc=teacher().classes.filter(function(k){return k.id===t.dataset.clsname;})[0];if(kc){kc.data.cls=t.value;changed=true;}}
  if(t.dataset.sname){var kd=teacher().classes.filter(function(k){return k.id===t.dataset.cid;})[0],st=kd&&kd.data.students.filter(function(s){return s.id===t.dataset.sname;})[0];if(st){st.name=t.value;changed=true;}}
  if(changed)persistTeacher(teacher());
});
document.addEventListener('change',function(ev){if(ev.target.dataset&&ev.target.dataset.tc)render(true);});
window.addEventListener('resize',fitPaper);
window.addEventListener('afterprint',fitPaper);

/* ---------- التشغيل ---------- */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
loadAll().then(function(list){APP.teachers=(list||[]).filter(function(t){return t&&t.id&&t.pin;}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});APP.ui='login';render();});

/* العمل دون إنترنت: عامل الخدمة يحفظ ملفات البرنامج، ويُعلن عن التحديثات */
var UPDATING=false;
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){
      if(nw.state==='installed'&&navigator.serviceWorker.controller){toast('يتوفر تحديث جديد للبرنامج',null);var t=document.getElementById('toast');if(t){var bt=document.createElement('button');bt.textContent='تحديث الآن';bt.onclick=function(){UPDATING=true;nw.postMessage('skip');};t.appendChild(bt);}}});});
  }).catch(function(){});
  /* لا تُعاد الصفحة إلا إذا طلب المعلم التحديث بنفسه، حتى لا يخرج من حسابه أثناء العمل */
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!UPDATING)return;UPDATING=false;location.reload();});
}
</script>
</body>
